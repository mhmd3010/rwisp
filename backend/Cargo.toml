[package]
name = "rwisp-server"
version = "0.1.0"
edition = "2024"
default-run = "rwisp-server"

[dependencies]
axum = "0.8.9"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls"] }
dotenvy = "0.15.7"
mikrotik-rs = { version = "0.8.0", features = ["tokio-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
aes-gcm = "0.10"
rpassword = "7"
subtle = "2"
