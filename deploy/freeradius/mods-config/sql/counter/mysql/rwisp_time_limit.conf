# Query for sqlcounter time_limit (see mods-available/sqlcounter.disabled).
# Scoped to the current subscription window via RWISP-Subscription-Start.

query = "SELECT COALESCE(SUM(acctsessiontime), 0) FROM radacct WHERE username = '%{${key}}' AND acctstarttime >= '%{reply:RWISP-Subscription-Start}'"
