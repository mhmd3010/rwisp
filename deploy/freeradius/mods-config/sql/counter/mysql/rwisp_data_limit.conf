# Query for sqlcounter data_limit (see mods-available/sqlcounter.disabled).
# Requires acctinputgigawords/acctoutputgigawords to exist in radacct.
# Scoped to the current subscription window via RWISP-Subscription-Start.

query = "SELECT COALESCE(SUM(acctinputoctets + acctoutputoctets + (acctinputgigawords + acctoutputgigawords) * 4294967296), 0) FROM radacct WHERE username = '%{${key}}' AND acctstarttime >= '%{reply:RWISP-Subscription-Start}'"
